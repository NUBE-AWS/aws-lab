# 야간 점검(#28, 설계 7.4 · 8.3) — 매일 23시(KST) 서울 리전에 과금 자원이 남아 있으면 이슈로 알린다.
#
# - 잘 동작하는지 보는 점검이 아니라, 지우는 것을 잊은 자원을 알리는 비용 경보다. Budgets 는 하루 최대 세 번 갱신돼 늦다.
# - 조회만 한다. 자동 destroy 는 하지 않는다(일부러 켜 둔 날의 사고 방지).
# - 이미 열린 점검 이슈가 있으면 새로 만들지 않고 댓글을 단다.
# - 봇이 만든 이슈는 저장소를 Watch 한 사람에게만 알림이 간다 → 생성 때 두 사람 assignee, 댓글에는 두 사람 멘션.
# - 공개 저장소라 이슈에는 자원 종류 · 개수 · ID · 이름만 적는다(계정 ID · ARN · IP 주소 없음).
# - 예약 실행은 main 의 이 파일로만 돈다. 공개 저장소는 60일 동안 활동이 없으면 예약이 꺼진다(GitHub 가 메일로 알림).

name: nightly-check

on:
  schedule:
    - cron: "0 14 * * *" # UTC 14:00 = KST 23:00
  workflow_dispatch: # 손으로 시험 실행

permissions: {}

concurrency:
  group: nightly-check
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  TITLE_PREFIX: "[야간 점검]"
  # 알림을 받을 두 사람(GitHub 로그인)
  PEOPLE: "son-dy kimeopeum77-ai"

jobs:
  check:
    name: 과금 자원 확인
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write # OIDC → GitHubActionsNightlyCheck
      issues: write # 이슈 생성 · 댓글
    steps:
      # Secret 이 비어 있으면 점검이 조용히 빠지지 않게 실패로 드러낸다.
      - name: 설정 확인
        env:
          ROLE: ${{ secrets.AWS_NIGHTLY_ROLE_ARN }}
        run: |
          if [ -z "$ROLE" ]; then
            echo "::error::Secret AWS_NIGHTLY_ROLE_ARN 이 비어 있습니다(00-foundation 출력 github_nightly_role_arn)."
            exit 1
          fi

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_NIGHTLY_ROLE_ARN }}
          role-session-name: gha-nightly-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      # 종류마다 "ID 이름" 줄을 모은다. 이름은 Name 태그(없으면 -).
      - name: 조회
        id: scan
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/found.md"
          : > "$out"
          total=0

          # add <제목> <명령...> — 명령을 실행해 결과 줄(자원 하나에 한 줄)을 모은다.
          # 명령을 변수 대입으로 실행해야 조회가 실패했을 때 set -e 로 job 이 실패한다.
          # (인자 안의 $(...) 로 쓰면 실패가 묻혀 「남은 자원 0개」로 잘못 보고된다 — 비용 경보에서 가장 나쁜 실패)
          add() {
            local title="$1" lines n
            shift
            lines=$("$@")
            n=$(printf '%s' "$lines" | grep -c . || true)
            if [ "$n" -gt 0 ]; then
              total=$((total + n))
              { echo "**$title** — $n개"; printf '%s\n' "$lines" | sed 's/^/- /'; echo; } >> "$out"
            fi
          }

          add "EKS 클러스터(시간당 0.10달러)" \
            aws eks list-clusters --query 'clusters[].[@]' --output text

          add "NAT Gateway(시간당 0.059달러 + 처리량)" \
            aws ec2 describe-nat-gateways --filter Name=state,Values=pending,available \
              --query 'NatGateways[].[NatGatewayId, Tags[?Key==`Name`]|[0].Value || `-`]' --output text

          add "실행 중인 EC2(노드 · Karpenter)" \
            aws ec2 describe-instances --filters Name=instance-state-name,Values=pending,running \
              --query 'Reservations[].Instances[].[InstanceId, InstanceType, Tags[?Key==`Name`]|[0].Value || `-`]' --output text

          add "RDS 인스턴스(시간당 0.051달러~)" \
            aws rds describe-db-instances \
              --query 'DBInstances[?DBInstanceStatus!=`deleting`].[DBInstanceIdentifier, DBInstanceClass, DBInstanceStatus]' --output text

          add "로드 밸런서(ALB 등)" \
            aws elbv2 describe-load-balancers --query 'LoadBalancers[].[LoadBalancerName, Type, State.Code]' --output text

          add "연결 안 된 EBS 볼륨" \
            aws ec2 describe-volumes --filters Name=status,Values=available \
              --query 'Volumes[].[VolumeId, join(``, [to_string(Size), `GiB`])]' --output text

          # 공인 IPv4 는 연결 여부와 관계없이 시간당 과금. IP 주소는 적지 않는다.
          add "탄력적 IP(개당 시간당 0.005달러)" \
            aws ec2 describe-addresses \
              --query 'Addresses[].[AllocationId, AssociationId || `연결 안 됨`, Tags[?Key==`Name`]|[0].Value || `-`]' --output text

          sed -i 's/\t/ · /g' "$out"
          echo "total=$total" >> "$GITHUB_OUTPUT"
          echo "남은 과금 자원: $total개"
          cat "$out"

      - name: 이슈로 알리기
        if: steps.scan.outputs.total != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TOTAL: ${{ steps.scan.outputs.total }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          today=$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')
          mentions=$(for p in $PEOPLE; do printf '@%s ' "$p"; done)
          {
            echo "### ${today} KST 기준 서울 리전에 남은 과금 자원 ${TOTAL}개"
            echo
            cat "$RUNNER_TEMP/found.md"
            echo "- 지우는 것을 잊었다면 설계 8.3 순서(25 → 30 → 20 → 10)로 정리합니다."
            echo "- 일부러 켜 둔 것이면 이유를 댓글로 남기고 이 이슈를 닫습니다(8.3 규칙 2)."
            echo
            echo "<sub>[실행 기록]($RUN_URL) · 야간 점검(#28)은 조회만 하고 자동으로 지우지 않습니다.</sub>"
          } > body.md

          num=$(gh issue list --state open --search "in:title \"$TITLE_PREFIX\"" --json number,title \
                  --jq "[.[] | select(.title | startswith(\"$TITLE_PREFIX\"))][0].number // empty")

          if [ -n "$num" ]; then
            { echo "$mentions"; echo; cat body.md; } > comment.md
            gh issue comment "$num" --body-file comment.md
            echo "기존 이슈 #$num 에 댓글을 달았습니다."
          else
            assignees=$(echo $PEOPLE | tr ' ' ',')
            gh issue create --title "$TITLE_PREFIX 서울 리전에 과금 자원이 남아 있음" \
              --body-file body.md --assignee "$assignees"
          fi

      - name: 남은 자원 없음
        if: steps.scan.outputs.total == '0'
        run: echo "남은 과금 자원이 없습니다. 이슈를 만들지 않습니다."
