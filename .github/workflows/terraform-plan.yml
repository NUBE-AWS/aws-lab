# PR 마다 Terraform fmt · validate · plan 을 돌리고, 스택별 요약만 PR 댓글로 남긴다(설계 7.4, #13).
#
# - AWS 인증은 OIDC → GitHubActionsPlan 역할(읽기 + 상태 잠금 파일만). apply 는 하지 않는다.
# - 공개 저장소라 Actions 로그와 댓글은 누구나 본다. 그래서
#     · plan 전문은 로그 · 댓글에 남기지 않는다(파일로만 두고 요약만 꺼냄)
#     · 계정 ID 는 mask-aws-account-id 로, 버킷 이름 · 역할 ARN 은 Secrets 로 가린다
# - 포크에서 온 PR 은 Secrets · OIDC 토큰을 받지 못하므로 plan · 댓글 job 을 건너뛴다(fmt 만 돈다).
# - pull_request_target 은 쓰지 않는다(포크 코드가 쓰기 권한으로 돌 수 있음).

name: terraform-plan

on:
  pull_request:
    paths:
      - "envs/**"
      - "bootstrap/**"
      # 워크플로 자체를 고친 PR 에서도 돌아야 고친 결과를 시험할 수 있다
      - ".github/workflows/terraform-plan.yml"

# 기본은 권한 없음. job 마다 필요한 것만 연다.
permissions: {}

# 같은 PR 에 새 커밋이 오면 이전 실행을 취소한다.
concurrency:
  group: terraform-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TF_VERSION: "1.16.6"
  AWS_REGION: ap-northeast-2
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: terraform fmt -check
        run: terraform fmt -check -recursive -diff

  # 이 PR 에서 바뀐 스택을 고른다.
  changes:
    name: 바뀐 스택
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      stacks: ${{ steps.pick.outputs.stacks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: pick
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed=$(git diff --name-only "$BASE_SHA"..."$HEAD_SHA")
          echo "바뀐 파일:"; echo "$changed"

          # 대상 스택: bootstrap + envs/dev/NN-이름. 25-addons 는 클러스터 API 에 닿아야 해서 제외(설계 7.4).
          all=$( { echo bootstrap; find envs/dev -mindepth 1 -maxdepth 1 -type d -name '[0-9][0-9]-*' | sort; } \
                 | grep -v -x 'envs/dev/25-addons' )

          # 공통 파일(워크플로 · backend 예시)이 바뀌면 전부, 아니면 파일이 속한 스택만.
          if echo "$changed" | grep -q -x -E '\.github/workflows/terraform-plan\.yml|envs/dev/backend\.hcl\.example'; then
            picked="$all"
          else
            picked=$(for s in $all; do echo "$changed" | grep -q "^$s/" && echo "$s" || true; done)
          fi

          stacks=$(printf '%s\n' $picked | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "고른 스택: $stacks"
          echo "stacks=$stacks" >> "$GITHUB_OUTPUT"

  plan:
    name: plan (${{ matrix.stack }})
    needs: changes
    if: >-
      needs.changes.outputs.stacks != '[]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # OIDC 토큰 — 이 job 에만
    strategy:
      fail-fast: false
      matrix:
        stack: ${{ fromJSON(needs.changes.outputs.stacks) }}
    env:
      STACK: ${{ matrix.stack }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: meta
        run: |
          # 스택 이름은 위 changes job 이 고른 값이지만, 경로로 쓰기 전에 한 번 더 형식을 확인한다.
          if ! echo "$STACK" | grep -q -x -E 'bootstrap|envs/dev/[0-9]{2}-[a-z0-9-]+'; then
            echo "알 수 없는 스택: $STACK"; exit 1
          fi
          echo "id=$(echo "$STACK" | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: gha-plan-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      # backend.hcl 은 계정 ID 가 들어가 커밋하지 않으므로(.gitignore) 여기서 만든다. key 는 각 스택의 versions.tf 에 있다.
      - name: backend.hcl 만들기
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
        run: |
          cat > "$RUNNER_TEMP/backend.hcl" <<EOF
          bucket       = "$TF_STATE_BUCKET"
          region       = "$AWS_REGION"
          encrypt      = true
          use_lockfile = true
          EOF

      - id: init
        working-directory: ${{ matrix.stack }}
        run: terraform init -backend-config="$RUNNER_TEMP/backend.hcl" -no-color > "$RUNNER_TEMP/init.log" 2>&1 || { tail -n 30 "$RUNNER_TEMP/init.log"; exit 1; }

      - id: validate
        working-directory: ${{ matrix.stack }}
        run: terraform validate -no-color

      # plan 전문은 파일로만 둔다. 실패했을 때만 끝부분을 로그에 보인다(계정 ID 는 가려짐).
      - id: plan
        working-directory: ${{ matrix.stack }}
        run: |
          set +e
          terraform plan -no-color -lock-timeout=120s -detailed-exitcode -out=tfplan > "$RUNNER_TEMP/plan.log" 2>&1
          rc=$?
          set -e
          # 0 = 변경 없음, 2 = 변경 있음, 1 = 오류
          if [ "$rc" -eq 1 ]; then tail -n 40 "$RUNNER_TEMP/plan.log"; exit 1; fi
          terraform show -json tfplan > "$RUNNER_TEMP/plan.json"

      # 스택 하나의 요약을 만든다. 실패해도 「어느 단계에서 실패」를 남긴다.
      - name: 요약
        if: always() && steps.meta.outcome == 'success'
        env:
          ID: ${{ steps.meta.outputs.id }}
          INIT: ${{ steps.init.outcome }}
          VALIDATE: ${{ steps.validate.outcome }}
          PLAN: ${{ steps.plan.outcome }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/summary/$ID.md"
          mkdir -p "$(dirname "$out")"
          if [ "$PLAN" = "success" ]; then
            j="$RUNNER_TEMP/plan.json"
            add=$(jq '[.resource_changes[]? | select(.change.actions | index("create"))] | length' "$j")
            chg=$(jq '[.resource_changes[]? | select(.change.actions == ["update"])] | length' "$j")
            del=$(jq '[.resource_changes[]? | select(.change.actions | index("delete"))] | length' "$j")
            if [ "$add$chg$del" = "000" ]; then result="변경 없음"; else result="add $add · change $chg · destroy $del"; fi
            echo "| \`$STACK\` | ✅ $result |" > "$out"
            # destroy · replace 는 리소스 이름만 적는다(값은 적지 않음).
            jq -r '.resource_changes[]? | select(.change.actions | index("delete"))
                   | "  - " + (if (.change.actions | index("create")) then "replace" else "destroy" end) + ": `" + .address + "`"' "$j" \
              > "$RUNNER_TEMP/summary/$ID.details"
          else
            step="init"; [ "$INIT" = "success" ] && step="validate"; [ "$VALIDATE" = "success" ] && step="plan"
            echo "| \`$STACK\` | ❌ $step 실패 — Actions 로그 확인 |" > "$out"
          fi
          cat "$out"

      - if: always() && steps.meta.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plan-${{ steps.meta.outputs.id }}
          path: ${{ runner.temp }}/summary/
          retention-days: 1
          if-no-files-found: ignore

  # 스택별 요약을 모아 PR 댓글 하나로 남긴다(있으면 갱신).
  comment:
    name: PR 댓글
    needs: [changes, plan]
    if: >-
      always() &&
      needs.changes.outputs.stacks != '[]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: plan-*
          merge-multiple: true
          path: summary
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          marker="<!-- terraform-plan -->"
          {
            echo "$marker"
            echo "### Terraform plan"
            echo
            echo "| 스택 | 결과 |"
            echo "| :-- | :-- |"
            if ls summary/*.md >/dev/null 2>&1; then cat summary/*.md; else echo "| — | 요약 없음(plan job 이 돌지 않음) |"; fi
            details=$(cat summary/*.details 2>/dev/null || true)
            if [ -n "$details" ]; then
              echo
              echo "**destroy · replace**"
              echo "$details"
            fi
            echo
            echo "<sub>커밋 \`${HEAD_SHA:0:7}\` · [실행 기록]($RUN_URL) · 공개 저장소라 plan 전문은 남기지 않습니다. 자세한 내용은 로컬에서 plan 하세요.</sub>"
          } > body.md

          id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
                 --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@body.md > /dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@body.md > /dev/null
          fi
